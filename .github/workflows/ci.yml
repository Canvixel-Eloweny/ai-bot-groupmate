# 四层门禁（2026-10-05 开源前审查 · S-11）
#
# 为什么必须有它：此前四层（check-wb / smoke / presets / panel）**只能靠人在本机跑**，
# `CONTRIBUTING.md` 也是这么写的。于是"真实凭据被 `git add -A` 带进仓库"这类事故
# 没有任何机器门槛拦着 —— 本仓已发生过两次（`.gitignore:154-155` 有记录）。
# ⇒ 把边界从「人记得跑」挪回「机器会跑」，与本项目别处同一条纪律。
#
# ⚠️ `publish-audit` 那一步是**真值闸门**：它按 `scripts/known-real.mjs`（**加载器**）扫
#    `git ls-files`，命中真实 QQ 号 / 群号 / 本机路径即非零退出。
#    真值一旦进仓库，这一步会红 —— 补的是"人眼会漏"的那一半。
#
# ⚠️ **2026-10-05（S-01）之后这一档在 CI 里是"降级"的，必须知道**：
#    真值表本体**不在仓库里**（住 `~/.qqbot/known-real.local.mjs`），所以 runner 上
#    加载不到 → 表为空 → 脚本会打印一条**显眼告警**并按"无阻断项"退出 0。
#    ⇒ CI 这一步实际只查**凭据形态**（`credential-shapes.mjs`）与**敏感路径/必需文件**；
#      "已知真实标识符"那一类**在 CI 上永远扫不出东西**，它只在维护者本机有效。
#      想恢复完整闸门：给 CI 注入 `QQBOT_KNOWN_REAL` 指向一份 secret（**不要**提交表本体）。
#    本仓的完整真值体检仍然只能在维护者机器上跑 —— 这条如实写在这里，不假装 CI 全覆盖。
#
# ⚠️ 跑测试一律 `NODE_OPTIONS=`（R39）：shell 注入的 node-language-shim 会把
#    `err.code` 改写成 `CODEBUDDY_BROKER_DENY`，不带前缀会出现假红。

name: 四层门禁

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_windows:
        description: '跑完四层回归后构建未签名 Windows 安装器（不含 Release/tag）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  contracts:
    name: 契约（check-wb）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # 契约里有一条断言「`.git/hooks/pre-commit` 在位」（第 21 轮 §86 那一族的配套判据）。
      # ⚠️ 钩子**不入库**，所以全新 clone 上必然没有它 —— 2026-10-06 首次真跑 CI 时正是这里红。
      # 跑一遍它自己给出的装法（`--install`）：既让那条断言的语义成立，
      # 也**顺带证明在干净 clone 上装得起来**（那条断言的原话就是"换机器或重新 clone 后要重装"）。
      # 钩子在本 job 里永远不会被触发（runner 上没有人 commit），所以这里只验"装得上"。
      - run: bash scripts/pre-commit.sh --install
      - run: NODE_OPTIONS= node scripts/check-wb.mjs
      # 变异清单是契约的“牙齿”：锚点失效/清单被删时，本地 pre-commit 会红，
      # 但此前 GitHub CI 不跑它 —— PR 上判据腐烂没有人拦。补上这一层，约 1 秒。
      - run: NODE_OPTIONS= node scripts/mutate-lint.mjs

  smoke:
    name: 行为回归（smoke）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # `T334` 要**真跑** `pgrep` + `lsof` 去验「真机探针路径」。runner 上 pgrep 自带（procps），
      # `lsof` 不保证在 —— 装上它，这条用例在 Linux 上才是**真验**，而不是落到显式 SKIP。
      # （这条用例正是 2026-10-06 首次真跑 CI 时逮出 `/usr/sbin/lsof` 写死缺陷的那一条：
      #   lsof 在 macOS 住 /usr/sbin、在 Debian/Ubuntu 住 /usr/bin。装上再跑才验得动。）
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lsof
      # T348 的夹具用 `bigmodel.cn.localhost` 让 provider 判成 zhipu 同时流量回环。
      # macOS 自带解析，Debian/Ubuntu 精简镜像不一定有 nss-myhostname ⇒ 显式补一行，
      # 否则 smoke 会以「模型调用失败: fetch failed」红，看起来像产品坏了。
      - run: echo "127.0.0.1 bigmodel.cn.localhost" | sudo tee -a /etc/hosts
      - run: NODE_OPTIONS= node test/smoke.js
        env:
          QQBOT_SMOKE_BASE_PORT: '31000'

  # ── ★ Windows 契约（2026-10-15 新增 · 对应 Issue #5 里 ROI 最高的一条）────────────
  #
  # 为什么必须有它：此前三个 job **全跑 `ubuntu-latest`**，而 C 组的 41 条红
  # （`check-wb` 的路径分隔符 / `.pathname` 未解码）**只在 Windows 上出现** ⇒
  # 在 CI 上永远看不见、只能靠人在本机跑。加一个 job 就把边界从"人记得跑"挪回"机器会跑"，
  # 与本文件开头那条纪律同源。
  #
  # ⚠️ 两个总根因（本轮已修，这个 job 就是防它们复发的哨兵）：
  #    ① `path.relative(REPO, f)` 在 Windows 回**反斜杠**（`src\holidays.js`），
  #       而判据比的是正斜杠字面量（`src/holidays.js`）⇒ Map 查空、`===` 恒假。
  #       修法：统一走 `scripts/check-wb.mjs` 的 `relOf()`。
  #    ② `new URL(`../src/${f}`, import.meta.url).pathname` 在 Windows 回 `/F:/…`
  #       （前导斜杠 + 正斜杠），`fs.existsSync` 恒 false ⇒ fail-closed。
  #       修法：`fileURLToPath()` 解码（该文件第 23 行的自证也在防它）。
  #
  # ⚠️ **pre-commit 钩子那一步刻意不跑**：它是 bash 脚本 + 符号链接语义，在 Windows
  #    runner 上装不起来（"换机器要重装"是正常状态，不是缺陷），且与路径判据无关。
  #    本 job 只验 `check-wb` 这一层契约。
  # ⚠️ 一律用 `env: NODE_OPTIONS: ''` 而不是 `NODE_OPTIONS= node …`：后者是 bash 前缀语法，
  #    windows-latest 的默认 shell 是 pwsh，跑不通（R39：不带这个前缀会出现假红）。
  windows-contracts:
    name: 契约（check-wb · Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/check-wb.mjs
        env:
          NODE_OPTIONS: ''
      # P3-5：Windows 侧真渲染 DOM + 安装器纯判据。用 pwsh 循环逐个跑，
      # 任何一步非零立即退出（$LASTEXITCODE 不会被 PowerShell 自动变成失败）。
      - name: Windows 门禁（DOM + installer）
        shell: pwsh
        run: |
          $env:NODE_OPTIONS = ''
          $tests = @(
            'check-desktop',
            'desktop-diagnostics',
            'p3-differential-eval',
            'p3-ci-eval',
            'installer-p1', 'installer-p2', 'installer-p3',
            'installer-p4', 'installer-p5', 'installer-p6'
          )
          foreach ($t in $tests) {
            Write-Host "── node test/$t.mjs"
            node "test/$t.mjs"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      # Windows runner 自带 Edge；panel-dom 若因找不到浏览器 SKIP，这里必须红，
      # 否则「四层」里的 DOM 层在 CI 上又变成没人跑。
      - name: 前端 DOM 必须真渲染（Windows Edge）
        shell: pwsh
        run: |
          $env:NODE_OPTIONS = ''
          $out = node test/panel-dom.mjs 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($out -match 'SKIP 前端 DOM 守卫') { Write-Error 'panel-dom 在 Windows 上 SKIP 了'; exit 1 }

  # 真值闸门：别让真实 QQ 号 / 群号 / 本机用户名 / API Key 进仓库
  publish-audit:
    name: 发布审计（真值闸门）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # ⚠️ 2026-10-06：这个脚本**按设计不随发布拷贝出去**（它在 `make-publish-copy.mjs` 的 EXCLUDE
      #    清单里，理由与那条 S-01 裁决绑定，被变异 `sec-s01-1005` 钉着）。
      #    于是**公开仓里这一步会被跳过**、本仓（开发仓）里照常跑 —— 用一个**步骤条件**而不是删 job：
      #    `hashFiles` 要在 checkout 之后求值，所以只能放步骤级、不能放 job 级
      #    （放 job 级会连开发仓也一起跳过，那道真值闸就静默失效了）。
      - if: ${{ hashFiles('scripts/publish-audit.mjs') != '' }}
        run: node scripts/publish-audit.mjs

  # ── P3-5：四层回归（只在手动构建时跑）──────────────────────────────────────
  #
  # `ci-verify.mjs` 从 `package.json.scripts.verify` 派生步骤，只允许在公开拷贝上
  # 跳过按设计不发布的 `scripts/publish-audit.mjs`；其它缺失一律 fail-closed。
  # 构建 job 必须等这一条和上面四个 job 全绿，才允许出包。
  regression:
    name: 四层回归（ci-verify）
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_windows }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lsof rsync unzip
      - run: echo "127.0.0.1 bigmodel.cn.localhost" | sudo tee -a /etc/hosts
      - run: bash scripts/pre-commit.sh --install
      - name: 全量四层回归
        run: node scripts/ci-verify.mjs
        env:
          NODE_OPTIONS: ''
          TZ: UTC
          QQBOT_SMOKE_BASE_PORT: '31000'

  # ── P3-5：Windows 安装器构建（手动 dispatch，四层全绿后才启动）──────────────
  desktop-build:
    name: Windows 安装器构建（未签名）
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_windows }}
    needs: [contracts, smoke, windows-contracts, publish-audit, regression]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: npm ci
      - name: 工作树必须干净（BUILD-INFO 的 clean 标记）
        shell: pwsh
        run: |
          $dirty = git status --porcelain
          if ($dirty) {
            Write-Host $dirty
            Write-Error '工作树不干净，拒绝出包'
            exit 1
          }
      - name: 安装 NSIS 3.13
        run: choco install nsis --version=3.13.0 -y --no-progress
      - name: 构建安装器
        run: node packaging/windows/installer/build-installer.mjs --build-dir "$env:RUNNER_TEMP/eb-build" --artifact-dir "$env:RUNNER_TEMP/eb-artifact" --makensis "C:\Program Files (x86)\NSIS\makensis.exe" --require-provenance
        env:
          NODE_OPTIONS: ''
      - name: 上传未签名构建产物
        uses: actions/upload-artifact@v7
        with:
          name: estrella-bot-setup-${{ github.sha }}
          path: |
            ${{ runner.temp }}/eb-artifact/Estrella-Bot-Setup-*.exe
            ${{ runner.temp }}/eb-artifact/payload-manifest.json
            ${{ runner.temp }}/eb-artifact/BUILD-INFO.txt
            ${{ runner.temp }}/eb-artifact/build-receipt.json
            ${{ runner.temp }}/eb-artifact/ARTIFACT-SHA256SUMS.txt
            ${{ runner.temp }}/eb-artifact/makensis.log
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
