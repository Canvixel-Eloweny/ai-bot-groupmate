# 提交入口配置（GitHub 的「新建 issue」选择器）
#
# ⚠️ 2026-10-05（第 10 轮 · 开源前审查 H-06）：这里原本有两条 `contact_links`，
#    指向的是**保留占位域**（RFC 2606 的 `.invalid`，也就是**两条死链**）。
#    而它恰好是"漏洞上报"的唯一入口：一个投不出去的上报流程等于没有（H-06 的原话）。
#
# 现在整块**撤掉**，而不是换成另一条猜出来的地址 —— 理由：
#   · 本仓库**还没有 remote**；对外发布走"生成拷贝"还是"直推本仓库"**也还没定**；
#   · 于是此刻写任何 `github.com/<owner>/<repo>/...` 都是**臆造地址**，
#     而"看不出是假地址的假地址"比"明显的死链"更坏（前者会被当成真的去试）。
#
# 上报方式见 `SECURITY.md`（README 的「参与本项目」一节里链得到）——
# 那里写的是**与仓库地址无关**的路径：仓库页面 → Security → Report a vulnerability。
#   ⚠️ 发布前请到 *Settings → Code security* 打开 **Private vulnerability reporting**，
#      否则那个按钮不存在，等于这条指引也不成立。
#   ⚠️ 目标仓库地址定下来之后，再把 advisories 的绝对链接补回这里
#      （已登记为待裁决项，不在这里偷偷填一个占位域名）。
blank_issues_enabled: false
